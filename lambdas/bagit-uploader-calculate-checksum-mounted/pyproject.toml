[project]
name = "bagit-uploader-calculate-checksum-mounted"
version = "4.0.0"
description = "Verify BagIt file checksums using mounted Oneclient"
requires-python = ">=3.12"
dependencies = [
    "checksum",
    "onedata-lambda-utils>=1.0",
    "xattr>=1.1",
]

[project.entry-points."onedata.lambda"]
handler = "bagit_uploader_calculate_checksum_mounted.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagit_uploader_calculate_checksum_mounted"]
