[project]
name = "create-dir-structure-rest"
version = "4.0.0"
description = "Create directory structure"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
    "requests>=2.32",
]

[project.entry-points."onedata.lambda"]
handler = "create_dir_structure_rest.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/create_dir_structure_rest"]
