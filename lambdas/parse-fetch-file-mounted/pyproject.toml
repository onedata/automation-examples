[project]
name = "parse-fetch-file-mounted"
version = "4"
description = "Parse fetch file using mounted Oneclient"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
]

[project.entry-points."onedata.lambda"]
handler = "parse_fetch_file_mounted.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parse_fetch_file_mounted"]
