[project]
name = "echo"
version = "5.0.0"
description = "Echo lambda — returns its input as output; optionally delays, throws, or streams (used to exercise the automation engine)"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-utils>=1.0",
]

[project.entry-points."onedata.lambda"]
handler = "echo.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo"]
