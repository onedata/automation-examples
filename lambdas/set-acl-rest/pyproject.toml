[project]
name = "set-acl-rest"
version = "4.0.0"
description = "Set ACL metadata using Oneprovider REST API"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-utils>=1.0",
    "requests>=2.32",
]

[project.entry-points."onedata.lambda"]
handler = "set_acl_rest.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/set_acl_rest"]
