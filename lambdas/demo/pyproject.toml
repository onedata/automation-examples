[project]
name = "demo"
version = "4.0.0"
description = "A simple demo lambda showing the basic lambda layout"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
]

[project.entry-points."onedata.lambda"]
handler = "demo.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]
