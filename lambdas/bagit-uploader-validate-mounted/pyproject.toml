[project]
name = "bagit-uploader-validate-mounted"
version = "4.0.0"
description = "Validate BagIt archives using mounted Oneclient"
requires-python = ">=3.12"
dependencies = [
    "bagit-archive",
    "onedata-lambda-utils>=1.0",
]

[project.entry-points."onedata.lambda"]
handler = "bagit_uploader_validate_mounted.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagit_uploader_validate_mounted"]
