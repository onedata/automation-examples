[project]
name = "calculate-downloaded-file-checksum-mounted"
version = "4"
description = "Calculate the checksum of a downloaded file (by destination path) using a mounted Oneclient"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
    "xattr>=1.1",
    "checksum",
]

[project.entry-points."onedata.lambda"]
handler = "calculate_downloaded_file_checksum_mounted.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculate_downloaded_file_checksum_mounted"]
