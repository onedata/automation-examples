[project]
name = "bagit-uploader-unpack-data-mounted"
version = "4"
description = "Unpack BagIt archive data directory using mounted Oneclient"
requires-python = ">=3.12"
dependencies = [
    "bagit-archive",
    "onedata-lambda-sdk>=1.0",
]

[project.entry-points."onedata.lambda"]
handler = "bagit_uploader_unpack_data_mounted.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagit_uploader_unpack_data_mounted"]
