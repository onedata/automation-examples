[project]
name = "calculate-checksum-mounted"
version = "4.0.0"
description = "Calculate a file's checksum (and optionally store it as metadata) using a mounted Oneclient"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
    "xattr>=1.1",
    "checksum",
]

[project.entry-points."onedata.lambda"]
handler = "calculate_checksum_mounted.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculate_checksum_mounted"]
