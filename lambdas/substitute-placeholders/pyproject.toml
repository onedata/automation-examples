[project]
name = "substitute-placeholders"
version = "3"
description = "Substitute placeholders in a template"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
]

[project.entry-points."onedata.lambda"]
handler = "substitute_placeholders.handler:handle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substitute_placeholders"]
