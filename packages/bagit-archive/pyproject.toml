[project]
name = "bagit-archive"
version = "1.0.0"
description = "Shared BagIt archive access helpers for Onedata Automation lambdas"
requires-python = ">=3.12"
dependencies = [
    "onedata-lambda-sdk>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagit_archive"]
